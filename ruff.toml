# `ruff check .`: syntax errors and pyflakes (undefined names, unused imports and variables, ...).
target-version = "py310"
extend-exclude = ["docs_to_markdown_cloudflare.ipynb"]   # generated by dev/build_nb.py

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# The notebook's cells share one namespace: names used here are defined in earlier cells.
"dev/notebook/*.py" = ["F821", "F811", "F401"]
