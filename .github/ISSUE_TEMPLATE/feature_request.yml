name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the project help? Alternatives you considered?
  - type: checkboxes
    id: accuracy
    attributes:
      label: Accuracy
      options:
        - label: I understand that a change that trades accuracy for speed can be an option, but not the default.
